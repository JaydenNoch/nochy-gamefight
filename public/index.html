<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighting Game</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <script>
        // --- WASM_EXEC.JS (Inline Langsung agar tidak 404 / gagal muat) ---
        "use strict";
        (() => {
            const envs = {};
            const exits = new Map();
            let ex = (code) => {
                if (exits.has(code)) { exits.get(code)(); }
                else { console.error(`exit code ${code}`); }
            };
            let encoder = new TextEncoder("utf-8");
            let decoder = new TextDecoder("utf-8");
            
            globalThis.Go = class {
                constructor() {
                    this.argv = ["js"];
                    this.env = {};
                    this.exit = (code) => { ex(code); };
                    this._finished = false;
                }
                async run(instance) {
                    this._inst = instance;
                    let memory = this._inst.exports.mem;
                    this._values = [NaN, 0, null, true, false, globalThis, this];
                    this._goRefCounts = new Map();
                    this._ids = new Map();
                    this._idPool = [];
                    this.importObject = {
                        go: {
                            "runtime.wasmExit": (sp) => {
                                let code = getInt64(sp + 8);
                                this.exit(code);
                            },
                            "runtime.wasmWrite": (sp) => {
                                let fd = getInt64(sp + 8);
                                let p = getInt64(sp + 16);
                                let n = getInt64(sp + 24);
                                fs.writeSync(fd, new Uint8Array(memory.buffer, p, n));
                            },
                            "runtime.nanotime1": (sp) => {
                                setInt64(sp + 8, (performance.now() + performance.timeOrigin) * 1000000);
                            },
                            "runtime.walltime": (sp) => {
                                let mtx = (new Date()).getTime();
                                setInt64(sp + 8, Math.floor(mtx / 1000));
                                setInt32(sp + 16, (mtx % 1000) * 1000000);
                            },
                            "runtime.scheduleTimeoutEvent": (sp) => {
                                let delay = getInt64(sp + 8);
                                let id = setTimeout(() => { this._resume(); }, delay);
                                setInt32(sp + 16, id);
                            },
                            "runtime.clearTimeoutEvent": (sp) => {
                                let id = getInt32(sp + 8);
                                clearTimeout(id);
                            },
                            "runtime.getRandomData": (sp) => {
                                let r = getSlice(sp + 8);
                                crypto.getRandomValues(r);
                            }
                        }
                    };
                    function getInt64(addr) {
                        const dv = new DataView(memory.buffer);
                        return dv.getUint32(addr, true) + dv.getUint32(addr + 4, true) * 4294967296;
                    }
                    function setInt64(addr, v) {
                        const dv = new DataView(memory.buffer);
                        dv.setUint32(addr, v >>> 0, true);
                        dv.setUint32(addr + 4, Math.floor(v / 4294967296), true);
                    }
                    function setInt32(addr, v) {
                        const dv = new DataView(memory.buffer);
                        dv.setInt32(addr, v, true);
                    }
                    function getSlice(addr) {
                        const array = getInt64(addr);
                        const len = getInt64(addr + 8);
                        return new Uint8Array(memory.buffer, array, len);
                    }
                    await this._inst.exports._initialize();
                    this._finished = true;
                }
            };
        })();

        // --- INISIALISASI GAME ---
        if (!WebAssembly.instantiateStreaming) {
            WebAssembly.instantiateStreaming = async (resp, importObject) => {
                const source = await (await resp).arrayBuffer();
                return await WebAssembly.instantiate(source, importObject);
            };
        }

        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject)
            .then((result) => {
                go.run(result.instance);
            })
            .catch((err) => {
                console.error("Wasm load error:", err);
            });
    </script>
</body>
</html>
